# Production host-level edge (nginx) — reference configuration.
#
# The web container publishes its port ONLY to the host loopback
# (compose.yaml: 127.0.0.1:8000:8000). This host nginx owns 80/443,
# terminates TLS, and reverse-proxies to that internal port.
#
# Layout on the host:
#   systemd/nginx  (this file)  ->  127.0.0.1:8000 (compose web service)
#
# Replace the placeholders, install as /etc/nginx/sites-available/remedial,
# and `nginx -s reload` after a certificate renewal.

# HTTPS listener (production).
server {
    listen 443 ssl;
    http2 on;
    server_name remedial.example.com;

    ssl_certificate     /etc/letsencrypt/live/remedial.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remedial.example.com/privkey.pem;

    # Django requires these headers to honour the Host allow-list and TLS.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Plain-HTTP listener: redirect everything to HTTPS.
server {
    listen 80;
    server_name remedial.example.com;
    return 301 https://$host$request_uri;
}
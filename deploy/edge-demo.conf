# Demo-edge proxy: plain HTTP on port 80 -> web:8000 (container network).
# No TLS in the demo posture; certificates stay host-level in both postures
# (see deploy/compose-topology.md for the production edge).
server {
    listen 80;
    server_name _;

    location /static/ {
        proxy_pass http://web:8000;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
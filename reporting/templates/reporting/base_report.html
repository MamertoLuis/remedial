{% extends "base.html" %}

{% load static %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'reporting/css/print.css' %}" media="print">
{% endblock %}

{% block content %}
    <div class="app-page-header">
        <div class="app-page-header-text">
            <h1 class="app-page-title">{{ title }}</h1>
            {% if report_date %}
            <p class="app-page-subtitle">As of: {{ report_date|date:"F d, Y" }}</p>
            {% endif %}
        </div>
        <button type="button" class="app-btn app-btn-secondary" onclick="window.print()">
            Print Report
        </button>
    </div>
    <div class="app-section">
        {% block report_content %}
        {% endblock %}
    </div>
{% endblock %}

{% extends 'base_auth.html' %}

{% block title %}Sign Out | Remedial System{% endblock %}

{% block content %}
<div class="app-section">
    <h1 class="app-page-title text-center mb-1">Sign Out</h1>
    <p class="app-page-subtitle text-center mb-4">
        Are you sure you want to sign out <strong>&ldquo;{{ user.get_full_name|default:user.username }}&rdquo;</strong>?
    </p>

    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}
        <div class="app-form-actions">
            <a href="{% url 'dashboard' %}" class="app-btn app-btn-secondary">Cancel</a>
            <button type="submit" class="app-btn app-btn-danger">Sign Out</button>
        </div>
    </form>
</div>
{% endblock %}

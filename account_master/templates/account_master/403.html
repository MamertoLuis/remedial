{% extends "base.html" %}

{% block title %}403 - Access Denied{% endblock %}

{% block content %}
<div class="app-section">
    <h1 class="app-page-title">Access Denied</h1>
    <p class="app-empty-message">You do not have permission to access this page.</p>
    <p class="app-empty-message">Only users with {{ required_roles|default:"MANAGER or BOARD_MEMBER" }} role can access this feature.</p>
    <div class="flex gap-2 mt-3">
        <a href="{% url 'dashboard' %}" class="app-btn app-btn-primary">Back to Dashboard</a>
    </div>
</div>
{% endblock %}

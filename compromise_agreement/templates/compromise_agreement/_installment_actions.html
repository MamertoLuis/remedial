{% comment %}
Per-row installment actions. Mark-paid opens the shared confirm modal; the
modal posts to mark_installment_paid as an HTMX request that swaps the row
(behavior preserved from the pre-restyle hx-post button).
{% endcomment %}
<div class="flex gap-2">
    <a href="{% url 'compromise_installment_update' record.pk %}" class="app-btn app-btn-secondary app-btn-sm">Update</a>
    {% if record.status == 'UNPAID' %}
    <button type="button" class="app-btn app-btn-primary app-btn-sm"
            data-modal-open="mark-paid-modal"
            data-action-url="{% url 'mark_installment_paid' record.pk %}"
            data-hx-post="{% url 'mark_installment_paid' record.pk %}"
            data-hx-target="#installment-row-{{ record.pk }}"
            data-hx-swap="outerHTML">Mark Paid</button>
    {% endif %}
</div>
